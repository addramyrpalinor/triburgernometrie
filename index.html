<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recettes Connes</title><style>
:root{--red:#a11d18;--cream:#eee1c7;--ink:#211811}*{box-sizing:border-box}body{margin:0;color:#eee;background:linear-gradient(#17130fdd,#17130ff2),url('') center/cover fixed;font-family:system-ui,Segoe UI,sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 80% 15%,#e2733220,transparent 30%),linear-gradient(135deg,#15110d,#282017 45%,#0c0d0d)}header{padding:24px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #5b4028}.logo{font-weight:900;font-size:clamp(30px,5vw,64px);letter-spacing:-2px}.logo span{color:#c52c23}.tag{color:#c7b69d}.wrap{max-width:1180px;margin:auto;padding:28px 20px 70px}.controls{display:grid;grid-template-columns:1fr auto;gap:16px;margin-bottom:22px}.level{background:#211a14;border:1px solid #5a422e;padding:14px;border-radius:10px}.level label{font-size:12px;text-transform:uppercase;color:#b9a487;font-weight:800}.level input{width:100%;accent-color:#b4251f}.levelnames{display:flex;justify-content:space-between;color:#927e67;font-size:11px}.generate{background:linear-gradient(#bd3028,#841a16);border:2px solid #d76559;color:white;font-size:18px;font-weight:900;padding:12px 24px;border-radius:9px;cursor:pointer;box-shadow:0 6px 0 #50100e}.generate:active{transform:translateY(3px);box-shadow:0 3px 0 #50100e}.card{background:var(--cream);color:var(--ink);border:9px solid #3a291d;border-radius:10px;padding:clamp(20px,4vw,42px);box-shadow:0 18px 45px #0008}.kicker{color:#8b1f1a;font-weight:900;text-transform:uppercase;letter-spacing:2px;font-size:12px}.title{font-family:Georgia,serif;font-weight:900;font-size:clamp(30px,4vw,52px);line-height:1;margin:8px 0 12px}.desc{font-weight:700;color:#594838;margin-bottom:24px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 25px}.badge{padding:6px 10px;background:#37281e;color:#f3dfbd;border-radius:5px;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:35px}h2{font-size:17px;border-bottom:3px solid #8d2a21;padding-bottom:7px;text-transform:uppercase}.ingredients{padding:0;list-style:none}.ingredients li{padding:7px 0;border-bottom:1px dashed #b9aa92}.steps{padding-left:28px}.steps li{margin:0 0 13px;padding-left:4px}.footer{text-align:center;margin-top:24px;color:#aa967d;font-weight:700}.animal{color:#851e18;font-weight:900}.odd{background:#d1bc91;padding:1px 5px;border-radius:3px;font-weight:900}@media(max-width:700px){.controls,.grid{grid-template-columns:1fr}.generate{min-height:58px}}
</style></head><body><div class="app"><header><div><div class="logo">RECETTES <span>CONNES</span></div><div class="tag">Des recettes sérieusement pas sérieuses.</div></div><div style="font-size:38px">🪓🔥🥩</div></header><main class="wrap"><section class="controls"><div class="level"><label>Niveau de connerie : <b id="levelText">Mauvaise idée</b></label><input id="level" type="range" min="1" max="5" value="3"><div class="levelnames"><span>Questionnable</span><span>Crime culinaire</span></div></div><button class="generate" id="generate">GÉNÉRER UNE RECETTE CONNE</button></section><article class="card"><div class="kicker">Bonne bouffe. Mauvais jugement.</div><div class="title" id="title"></div><div class="desc" id="desc"></div><div class="badges" id="badges"></div><div class="grid"><section><h2>Sortes d'animal mort & autres ingrédients</h2><ul class="ingredients" id="ingredients"></ul></section><section><h2>Étapes approximatives</h2><ol class="steps" id="steps"></ol></section></div></article><div class="footer">MIEUX VAUT UNE RECETTE CONNE QU'UN FRIGO VIDE</div></main></div><script>
const meats=['bœuf','porc','bacon','poulet','agneau','canard','perdrix','tétras','chevreuil','wapiti','écureuil','bison','sanglier','orignal','lapin','dinde sauvage'];
const odds=['ananas en can','dattes','yogourt grec','sauce aux cerises','Ficello','Mountain Dew','curry de coconut','Doritos BBQ','sirop d’érable','beurre de peanut','Corn Flakes','jus de cornichons','Cheez Whiz','Root Beer','pêches en conserve','sauce VH aux prunes'];
const bases=['poutine','burger','burrito','lasagne','pizza','mac & cheese','grilled cheese','nachos','tourtière','pâté chinois','hot-dog','pain de viande'];
const styles=['fumé au bois d’érable','cuit au BBQ','saisi dans la fonte','fini sur le feu de camp','glacé puis grillé','braisé dans la bière'];
const extras=['cheddar fort','oignon rouge','jalapeños','patates douces','cornichons','mozzarella','sauce BBQ','mayonnaise épicée','champignons','oignons frits'];
const levels=['Questionnable','Ça passe après 3 bières','Mauvaise idée','Appelle tes chums','Crime culinaire'];
function pick(a){return a[Math.floor(Math.random()*a.length)]} function unique(a,n){return [...a].sort(()=>Math.random()-.5).slice(0,n)}
function generate(){let lvl=+document.getElementById('level').value;let ms=unique(meats,Math.min(2+Math.floor((lvl-1)/2),4));let os=unique(odds,Math.min(1+Math.floor(lvl/3),3));let bs=pick(bases),st=pick(styles),ex=unique(extras,2+Math.floor(lvl/3));
document.getElementById('title').textContent=`${bs.toUpperCase()} DE ${ms[0].toUpperCase()} ET ${ms[1].toUpperCase()} — ${os[0].toUpperCase()}`;document.getElementById('desc').textContent=`Une ${bs} ${st}, bourrée de mauvais jugement et pourtant assez crédible pour être essayée.`;document.getElementById('badges').innerHTML=`<span class="badge">🔥 ${st}</span><span class="badge">🥩 ${ms.length} sortes d’animal mort</span><span class="badge">⚠ ${levels[lvl-1]}</span>`;
let ing=[];ms.forEach((m,i)=>ing.push(`<li><span class="animal">${i?'400':'500'} g de ${m}</span></li>`));os.forEach(o=>ing.push(`<li><span class="odd">${o}</span> — quantité guidée par l’instinct</li>`));ex.forEach(e=>ing.push(`<li>${e}</li>`));ing.push(`<li>Base de ${bs} pour 4 personnes beaucoup trop confiantes</li>`,`<li>Sel, poivre et épices BBQ sans retenue</li>`);document.getElementById('ingredients').innerHTML=ing.join('');
let step=[`Préparer le ${ms[0]} et le ${ms[1]}; assaisonner généreusement.`,ms.length>2?`Ajouter ${ms.slice(2).join(' et ')}. À ce stade, il est trop tard pour reculer.`:`Faire dorer la viande jusqu’à obtenir une belle croûte.`,`Incorporer ${os.join(' et ')}. Ne pas chercher à comprendre.`,`Assembler le tout façon ${bs} avec ${ex.join(' et ')}.`,`Terminer le tout ${st}.`,lvl>=4?`Ajouter une couche supplémentaire de ${pick(odds)} parce que manifestement personne ne supervise cette cuisine.`:`Goûter et ajuster la sauce, le sel et le niveau de regret.`,`Servir immédiatement. Éviter d’expliquer la recette avant la première bouchée.`];document.getElementById('steps').innerHTML=step.map(x=>`<li>${x}</li>`).join('')}
const levelEl=document.getElementById('level');
const levelTextEl=document.getElementById('levelText');
const generateBtn=document.getElementById('generate');
const titleEl=document.getElementById('title');
const descEl=document.getElementById('desc');
const badgesEl=document.getElementById('badges');
const ingredientsEl=document.getElementById('ingredients');
const stepsEl=document.getElementById('steps');
levelEl.addEventListener('input',()=>{levelTextEl.textContent=levels[levelEl.value-1]});
generateBtn.addEventListener('click',generate);
generate();
</script></body></html>
